name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check app tests
      - name: Tests (pytest)
        run: uv run pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: caero
          POSTGRES_PASSWORD: caero
          POSTGRES_DB: caero
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_TYPE: postgresql
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DATABASE: caero
      PG_USER: caero
      PG_PASSWORD: caero
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # act_runner runs jobs directly on the host, where `services:` containers
      # are never started, so on Gitea the same database is brought up by hand.
      - name: Start PostgreSQL (self-hosted runner)
        if: github.server_url != 'https://github.com'
        run: |
          docker rm -f caero-ci-postgres >/dev/null 2>&1 || true
          docker run -d --rm --name caero-ci-postgres \
            -e POSTGRES_USER=caero -e POSTGRES_PASSWORD=caero -e POSTGRES_DB=caero \
            -p 5432:5432 postgres:17
          for _ in $(seq 1 30); do
            docker exec caero-ci-postgres pg_isready -U caero -q && exit 0
            sleep 2
          done
          echo "postgres did not become ready"
          docker logs caero-ci-postgres
          exit 1
      - name: Install dependencies
        run: uv sync --frozen
      - name: Tests against PostgreSQL
        run: uv run pytest -q
      - name: Stop PostgreSQL (self-hosted runner)
        if: always() && github.server_url != 'https://github.com'
        run: docker rm -f caero-ci-postgres >/dev/null 2>&1 || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test
      - name: Typecheck + build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend into backend static dir
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend
        working-directory: backend
        run: uv sync --frozen

      - name: Start backend
        working-directory: backend
        env:
          DB_TYPE: sqlite
          SQLITE_PATH: /tmp/caero-e2e.db
          SECRET_KEY: e2e-only-secret-key-not-for-production
        run: |
          # A host-mode self-hosted runner does not reap background processes
          # when a job ends, so a previous run's server may still hold the port.
          pkill -f 'uvicorn app.main:app --port 8000' || true
          # setsid + redirection detaches the server from the step's stdout and
          # stderr. Inheriting them makes act_runner wait for those pipes to
          # close when the step ends, which it never does while the server runs:
          # "exec: WaitDelay expired before I/O complete".
          setsid uv run uvicorn app.main:app --port 8000 \
            > "$RUNNER_TEMP/backend.log" 2>&1 < /dev/null &
          timeout 30 bash -c 'until curl -sf http://localhost:8000/api/health; do sleep 1; done' \
            || { echo "backend did not come up:"; cat "$RUNNER_TEMP/backend.log"; exit 1; }

      # --with-deps escalates with `sudo`, which a self-hosted runner has no
      # password for; the system libraries are installed on that host once,
      # out of band, so only the browser itself is fetched here.
      - name: Install Playwright browser
        working-directory: frontend
        run: |
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            npx playwright install chromium --with-deps
          else
            npx playwright install chromium
          fi

      - name: Run e2e tests
        working-directory: frontend
        run: npx playwright test

      - name: Stop backend
        if: always()
        run: pkill -f 'uvicorn app.main:app --port 8000' || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
