[project]
name = "caero"
version = "1.8.0"
description = "zero price tracker"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1,<0.142.0",
    "apscheduler>=3.11.3,<4.0.0",
    "sqlalchemy[asyncio]>=2.0.51,<3.0.0",
    "alembic>=1.19.1,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=4.0.0",
    "patchright>=1.61.2",
    "httpx>=0.27.0",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E712",  # `== True` needed for SQLAlchemy boolean comparisons
    "B008",  # Depends(...) in FastAPI signatures
]

[tool.ruff.lint.per-file-ignores]
# app must exist before the mounts/imports that follow it
"app/main.py" = ["E402"]
