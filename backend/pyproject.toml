[project]
name = "caero"
version = "0.6.4"
description = "zero price tracker"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.135.0,<0.136.0",
    "apscheduler>=3.10.0,<4.0.0",
    "sqlalchemy[asyncio]>=2.0.49,<2.1.0",
    "alembic>=1.18.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "patchright>=1.58.2",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "aiofiles>=25.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
